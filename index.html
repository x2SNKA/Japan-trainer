<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ECF0EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111719" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Japan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Japan-Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: one-column app shell (max 560px). Phrases are shown as Japanese station-name signs (ekimeihyō),
   the missions form a train line from Dresden to the trip, finished missions earn a station stamp (eki stamp). */
:root{
  --bg:#ECF0EE;
  --surface:#FFFFFF;
  --ink:#1B2427;
  --muted:#5B686A;
  --rule:#D2DAD7;
  --line:#2C8550;          /* JR-Grün: Linie, primäre Aktion, richtig */
  --line-soft:#DCEFE3;
  --on-line:#FFFFFF;
  --stamp:#6A3E9E;         /* Stempelfarbe */
  --stamp-soft:#EFE7F8;
  --bad:#B9420F;
  --bad-soft:#FBE7DC;
  --f-jp:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans",-apple-system,system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111719; --surface:#1A2225; --ink:#E7EEEC; --muted:#93A29F; --rule:#2E3A3D;
    --line:#4DB476; --line-soft:#1E3A2A; --on-line:#0D1A12;
    --stamp:#B39AE0; --stamp-soft:#2B2338; --bad:#F08A5D; --bad-soft:#3A2219;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111719; --surface:#1A2225; --ink:#E7EEEC; --muted:#93A29F; --rule:#2E3A3D;
  --line:#4DB476; --line-soft:#1E3A2A; --on-line:#0D1A12;
  --stamp:#B39AE0; --stamp-soft:#2B2338; --bad:#F08A5D; --bad-soft:#3A2219;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-inline:16px;padding-top:max(14px, env(safe-area-inset-top, 0px));padding-bottom:110px;-webkit-tap-highlight-color:transparent}
body.in-session{padding-bottom:max(32px, env(safe-area-inset-bottom, 0px))}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25}
h1{font-family:var(--f-jp);font-size:26px;font-weight:900}
h2{font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
p{margin:0}
.jp{font-family:var(--f-jp)}
.muted{color:var(--muted)}
.small{font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:var(--r);
  border:0;background:var(--line);color:var(--on-line);font-weight:700;font-size:17px;width:100%}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--rule)}
.btn.small{min-height:42px;font-size:15px;width:auto;padding:0 14px}
.btn:active{transform:translateY(1px)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > *{flex:1 1 140px}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top-left{display:flex;align-items:center;gap:12px;min-width:0}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--surface);border:2px solid var(--rule);display:grid;place-items:center;font-size:26px;flex:none}
.iconbtn{width:44px;height:44px;border-radius:50%;border:2px solid var(--rule);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.countdown{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.countdown .jp{font-weight:700;color:var(--line)}

/* Panel */
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.bar{height:10px;border-radius:6px;background:var(--line-soft);overflow:hidden}
.bar > span{display:block;height:100%;background:var(--line);border-radius:6px;transition:width .4s}
.bar-label{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}

/* Length picker */
.lens{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.len{background:var(--surface);border:2px solid var(--rule);border-radius:var(--r);padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:92px;justify-content:center}
.len b{font-size:17px}
.len span{font-size:13px;color:var(--muted)}
.len.main{background:var(--line);border-color:var(--line);color:var(--on-line)}
.len.main span{color:var(--on-line);opacity:.85}

/* Route (train line) */
.route{list-style:none;margin:0;padding:0;position:relative}
.route::before{content:"";position:absolute;left:19px;top:22px;bottom:22px;width:6px;border-radius:3px;background:var(--rule)}
.route .fill{position:absolute;left:19px;top:22px;width:6px;border-radius:3px;background:var(--line)}
.st{position:relative;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:8px 0}
.st-dot{width:24px;height:24px;margin-left:10px;border-radius:50%;background:var(--surface);border:5px solid var(--rule);position:relative;z-index:1}
.st.open .st-dot{border-color:var(--line)}
.st.cur .st-dot{background:var(--line);border-color:var(--line);box-shadow:0 0 0 5px var(--line-soft)}
.st-body{min-width:0;text-align:left;background:none;border:0;padding:4px 0}
.st-body b{display:block;font-size:17px}
.st-body .jp{font-size:14px;color:var(--muted)}
.st-meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.st.locked .st-body b{color:var(--muted)}
.st-goal .st-dot{border-radius:5px;border-color:var(--stamp)}

/* Stamp */
.stamp{width:54px;height:54px;border-radius:50%;border:3px double var(--stamp);color:var(--stamp);display:grid;place-items:center;
  font-family:var(--f-jp);font-weight:900;font-size:13px;line-height:1.05;text-align:center;transform:rotate(-10deg);background:var(--stamp-soft)}
.stamp.big{width:120px;height:120px;font-size:24px;border-width:6px}
.stamp.pop{animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{0%{transform:rotate(-30deg) scale(1.8);opacity:0}100%{transform:rotate(-10deg) scale(1);opacity:1}}

/* Station sign card */
.sign{background:var(--surface);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.sign-top{padding:20px 16px 14px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.sign-em{font-size:44px;line-height:1.1}
.sign-jp{font-family:var(--f-jp);font-weight:700;font-size:clamp(28px,8.5vw,46px);line-height:1.25;word-break:keep-all;overflow-wrap:anywhere}
.sign-jp.kana{font-size:96px;line-height:1.1}
.sign-ro{font-size:18px;letter-spacing:.05em;color:var(--muted)}
.sign-band{background:var(--line);color:var(--on-line);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:700}
.sign-band .sign-stn{font-size:12px;font-weight:500;opacity:.85;text-align:right}
.note{font-size:15px;color:var(--muted);padding:0 4px}

/* Session */
.sess-top{display:flex;align-items:center;gap:12px}
.sess-top .bar{flex:1}
.chip{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:var(--stamp-soft);color:var(--stamp)}
.prompt{font-size:20px;font-weight:700;text-align:center}
.prompt-de{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0}
.prompt-de .em{font-size:52px;line-height:1.1}
.prompt-de .de{font-size:24px;font-weight:700;text-align:center}
.play{width:96px;height:96px;border-radius:50%;border:0;background:var(--line);color:var(--on-line);display:grid;place-items:center;margin:8px auto}
.play svg{width:40px;height:40px}
.audio-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{min-height:76px;background:var(--surface);border:2px solid var(--rule);border-radius:12px;padding:10px;font-size:17px;line-height:1.3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}
.opt .em{font-size:24px}
.opt .ojp{font-family:var(--f-jp);font-weight:700;font-size:20px}
.opt .ojp.kana{font-size:40px}
.opt .oro{font-size:13px;color:var(--muted)}
.opt.right{border-color:var(--line);background:var(--line-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.feedback{font-weight:700;text-align:center;font-size:18px}
.feedback.ok{color:var(--line)}
.feedback.no{color:var(--bad)}
@media (max-width:360px){.opts{grid-template-columns:1fr}}

/* Profile picker */
.who{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.who-tile{background:var(--surface);border:2px solid var(--rule);border-radius:var(--r);padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.who-tile .avatar{width:64px;height:64px;font-size:36px}
.who-tile b{font-size:18px}
.who-tile .bar{width:100%}
.who-tile .small{font-variant-numeric:tabular-nums}

/* Lists */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.li{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:0;border-top:1px solid var(--rule);background:none;text-align:left;width:100%}
.li:first-child{border-top:0}
.li .em{font-size:26px;text-align:center}
.li .ljp{font-family:var(--f-jp);font-weight:700;font-size:19px;display:block}
.li .lro{font-size:14px;color:var(--muted);display:block}
.li .lde{font-size:15px;display:block}
.li svg{width:20px;height:20px;color:var(--muted)}
.kana-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.kana-cell{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:8px 4px;display:flex;flex-direction:column;align-items:center}
.kana-cell .jp{font-size:30px;font-weight:700;line-height:1.2}
.kana-cell span:last-child{font-size:13px;color:var(--muted)}
.search{width:100%;min-height:48px;border-radius:12px;border:2px solid var(--rule);background:var(--surface);color:var(--ink);padding:0 14px;font:inherit}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.fchip{flex:none;border:2px solid var(--rule);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700}
.fchip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Family */
.fam{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--rule)}
.fam:first-child{border-top:0}
.fam-stats{display:flex;gap:14px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.stamps-row{display:flex;gap:6px;flex-wrap:wrap}
.stamps-row .stamp{width:34px;height:34px;font-size:10px;border-width:2px}

/* Settings */
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px;border-top:1px solid var(--rule)}
.set:first-child{border-top:0}
.set > div{min-width:0}
.seg{display:flex;border:2px solid var(--rule);border-radius:10px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--surface);padding:8px 12px;font-size:14px;font-weight:700}
.seg button.on{background:var(--line);color:var(--on-line)}
.toggle{width:56px;height:32px;border-radius:16px;border:0;background:var(--rule);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--surface);transition:left .2s}
.toggle.on{background:var(--line)}
.toggle.on::after{left:28px}
.banner{background:var(--stamp-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:14px}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--rule);
  padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tab{border:0;background:none;border-radius:12px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:700;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--line);background:var(--line-soft)}
.foot{font-size:12px;color:var(--muted);text-align:center}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:15px}
.field input{min-height:52px;border-radius:12px;border:2px solid var(--rule);background:var(--surface);color:var(--ink);padding:0 14px;font:inherit;font-size:17px}
.err{color:var(--bad);font-weight:700;font-size:15px}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:15px;padding:8px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ---------- Datum ---------- */
const pad = n => String(n).padStart(2, '0');
const dstr = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => dstr(new Date());
const addDays = (s, n) => { const [y, m, d] = s.split('-').map(Number); return dstr(new Date(y, m - 1, d + n)); };
function weekKey(date) {

  const day = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));

}
function daysToTrip() {
  const t = new Date();

}

/* ---------- Speicher (lokal; Supabase-Sync wird hier angeschlossen) ---------- */
const KEY = 'japan-trainer.v1';
let storageOK = true;
function blankProfile() { return {epoch:0, cards:{}, xp:{}, sess:{}, stamps:[], settings:{romaji:true, goal:400, rate:0.9, t:0}}; }
function deviceId() {
  try { let d = localStorage.getItem(KEY + '.device'); if (!d) { d = Math.random().toString(36).slice(2, 10); localStorage.setItem(KEY + '.device', d); } return d; }
  catch (e) { return 'mem'; }
}
const DEV = deviceId();
// Ältere Datenstände (Vorschau 0.1) in das neue Format bringen
function migrate(p) {
  if (!p) return p;
  p.cards = p.cards || {}; p.stamps = p.stamps || []; p.epoch = p.epoch || 0;
  p.settings = Object.assign({romaji:true, goal:400, rate:0.9, t:0}, p.settings || {});
  if (p.xp) Object.keys(p.xp).forEach(k => { if (typeof p.xp[k] === 'number') p.xp[k] = {[DEV]: p.xp[k]}; });
  p.xp = p.xp || {};
  if (!p.sess) p.sess = typeof p.sessions === 'number' && p.sessions ? {[DEV]: p.sessions} : {};
  delete p.sessions; delete p.xpTotal;
  return p;
}
// Zwei Stände desselben Profils zusammenführen (z. B. iPhone und MacBook offline benutzt)
function mergeProfile(a, b) {
  if (!a) return b; if (!b) return a;
  if ((a.epoch || 0) !== (b.epoch || 0)) return (a.epoch || 0) > (b.epoch || 0) ? a : b;
  const out = blankProfile(); out.epoch = a.epoch || 0;
  new Set([...Object.keys(a.cards), ...Object.keys(b.cards)]).forEach(id => {
    const x = a.cards[id], y = b.cards[id];
    out.cards[id] = !x ? y : !y ? x : ((y.t || 0) > (x.t || 0) ? y : x);
  });
  new Set([...Object.keys(a.xp), ...Object.keys(b.xp)]).forEach(w => {
    const o = {};
    [a.xp[w] || {}, b.xp[w] || {}].forEach(m => Object.entries(m).forEach(([d, n]) => { o[d] = Math.max(o[d] || 0, n); }));
    out.xp[w] = o;
  });
  [a.sess || {}, b.sess || {}].forEach(m => Object.entries(m).forEach(([d, n]) => { out.sess[d] = Math.max(out.sess[d] || 0, n); }));
  out.stamps = [...new Set([...(a.stamps || []), ...(b.stamps || [])])];
  out.settings = (b.settings.t || 0) > (a.settings.t || 0) ? b.settings : a.settings;
  return JSON.parse(JSON.stringify(out));
}
function load() {
  try { localStorage.setItem(KEY + '.probe', '1'); localStorage.removeItem(KEY + '.probe'); }
  catch (e) { storageOK = false; }
  try { const raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch (e) { storageOK = false; }
  return null;
}
let S = load() || {v:1, profiles:{}, last:null};
PROFILES.forEach(p => { S.profiles[p.id] = S.profiles[p.id] ? migrate(S.profiles[p.id]) : blankProfile(); });
function saveLocal() {

}

/* ---------- Familien-Sync über Supabase ---------- */
const Sync = {
  sb:null, user:null, state:'off', lastAt:null, dirty:new Set(), timer:null, busy:false,
  init() {
    if (!CONFIG.supabaseUrl || !window.supabase || !window.supabase.createClient) { this.state = 'off'; render(); return; }
    try {
      this.sb = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey,
        {auth:{persistSession:true, autoRefreshToken:true, storageKey:'japan-trainer.auth'}});
    } catch (e) { this.state = 'off'; render(); return; }
    this.sb.auth.onAuthStateChange((ev, session) => { this.user = session ? session.user : null; });
    this.sb.auth.getSession().then(({data}) => {
      this.user = data && data.session ? data.session.user : null;
      this.state = this.user ? 'ok' : 'login';
      if (cur.screen !== 'session') render();
      if (this.user) this.pullAll();
    }).catch(() => { this.state = 'offline'; render(); });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && this.user) this.pullAll(); });
    window.addEventListener('online', () => { if (this.user) this.pullAll(); });
  },
  async login(email, pw) {
    const {data, error} = await this.sb.auth.signInWithPassword({email, password:pw});
    if (error) throw error;
    this.user = data.user; this.state = 'ok'; S.localOnly = false; saveLocal();
    await this.pullAll();
  },
  async logout() { try { await this.sb.auth.signOut(); } catch (e) {} this.user = null; this.state = 'login'; },
  async pullAll() {
    if (!this.user || this.busy) return;
    this.busy = true;
    try {
      const {data, error} = await this.sb.from('progress').select('profile,data');
      if (error) throw error;
      const remote = {}; (data || []).forEach(r => { remote[r.profile] = migrate(r.data); });
      PROFILES.forEach(pr => {
        const merged = mergeProfile(S.profiles[pr.id], remote[pr.id] || null);
        if (JSON.stringify(merged) !== JSON.stringify(remote[pr.id] || null)) this.dirty.add(pr.id);
        S.profiles[pr.id] = merged;
      });
      saveLocal(); this.state = 'ok'; this.lastAt = new Date();
    } catch (e) { this.fail(e); }
    this.busy = false;
    if (this.dirty.size) await this.flush();
    if (cur.screen !== 'session') render(); else this.badge();
  },
  push(pid) {
    if (!this.user) return;
    this.dirty.add(pid);
    clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 1500);
  },
  async flush() {
    if (!this.user || !this.dirty.size || this.busy) return;
    this.busy = true;
    const ids = [...this.dirty];
    try {
      const {data, error} = await this.sb.from('progress').select('profile,data').in('profile', ids);
      if (error) throw error;
      const remote = {}; (data || []).forEach(r => { remote[r.profile] = migrate(r.data); });
      const rows = ids.map(id => {
        S.profiles[id] = mergeProfile(S.profiles[id], remote[id] || null);
        return {user_id:this.user.id, profile:id, data:S.profiles[id], updated_at:new Date().toISOString()};
      });
      const {error:e2} = await this.sb.from('progress').upsert(rows, {onConflict:'user_id,profile'});
      if (e2) throw e2;
      ids.forEach(id => this.dirty.delete(id));
      saveLocal(); this.state = 'ok'; this.lastAt = new Date();
    } catch (e) { this.fail(e); }
    this.busy = false;
    this.badge();
  },
  fail(e) { this.err = e; this.state = navigator.onLine === false ? 'offline' : 'error'; },
  text() {
    if (S.localOnly || this.state === 'off') return 'Fortschritt liegt nur auf diesem Gerät';
    if (this.state === 'ok') return this.lastAt ? `Familien-Sync aktiv · zuletzt ${pad(this.lastAt.getHours())}:${pad(this.lastAt.getMinutes())} Uhr` : 'Familien-Sync aktiv';
    if (this.state === 'offline') return 'Offline · wird automatisch nachgeholt';
    if (this.state === 'error') return 'Sync gerade nicht möglich · wird später erneut versucht';
    return 'Nicht angemeldet · Fortschritt bleibt auf diesem Gerät';
  },
  badge() { document.querySelectorAll('.sync-text').forEach(el => { el.textContent = this.text(); }); }
};

/* ---------- Audio (eingebaute japanische Stimme) ---------- */
const hasTTS = 'speechSynthesis' in window;
let jaVoice = null;
function jaVoices() { return hasTTS ? speechSynthesis.getVoices().filter(v => /^ja/i.test(v.lang)) : []; }
// Qualität aus der technischen Kennung lesen: iOS nennt Kompakt- und Erweitert-Stimme beide nur "Kyoko"
function voiceQuality(v) {
  const id = (v.voiceURI || '') + ' ' + v.name;
  if (/premium/i.test(id)) return 3;
  if (/enhanced|erweitert/i.test(id)) return 2;
  if (/compact|kompakt/i.test(id)) return 0;
  return 1;
}
function voiceLabel(v, i, list) {
  const q = voiceQuality(v);
  const tag = q === 3 ? 'Premium' : q === 2 ? 'Erweitert' : q === 0 ? 'Kompakt' : '';
  const twins = list.filter(x => x.name === v.name).length > 1;
  return v.name + (tag ? ` (${tag})` : twins ? ` (Variante ${list.filter(x => x.name === v.name).indexOf(v) + 1})` : '');
}
function pickVoice() {
  if (!hasTTS) return null;
  const vs = jaVoices();
  if (S.voiceKey) {                                                     // auf diesem Gerät gewählt
    const [uri, idx] = S.voiceKey.split('|');
    const same = vs.filter(v => (v.voiceURI || v.name) === uri);
    if (same.length) return same[Math.min(+idx || 0, same.length - 1)];
  }
  return vs.slice().sort((a, b) => (voiceQuality(b) - voiceQuality(a)) || (/kyoko/i.test(b.name) - /kyoko/i.test(a.name)))[0] || null;
}
function voiceKey(v, list) {
  const uri = v.voiceURI || v.name;
  return uri + '|' + list.filter(x => (x.voiceURI || x.name) === uri).indexOf(v);
}
if (hasTTS) {
  jaVoice = pickVoice();
  speechSynthesis.onvoiceschanged = () => { jaVoice = pickVoice(); if (cur.screen === 'settings') render(); };
}
/* Aufgenommene Aussprache (audio/<hash>.m4a), erzeugt mit tools/make-audio.sh; sonst Gerätestimme */
const normJa = t => String(t).replace(/[\s　]+/g, '');
function audioKey(t) {                       // FNV-1a 32 Bit, identisch zu tools/build-texts
  let h = 0x811c9dc5; const s = normJa(t);
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return ('0000000' + h.toString(16)).slice(-8);
}
let AUDIO = new Set(), curAudio = null;
fetch('audio/index.json', {cache:'no-cache'}).then(r => r.ok ? r.json() : []).then(a => { AUDIO = new Set(a); if (cur.screen === 'settings') render(); }).catch(() => {});
function playRecorded(text, slow) {
  const k = audioKey(text);
  if (!AUDIO.has(k)) return false;
  try {
    if (hasTTS && (speechSynthesis.speaking || speechSynthesis.pending)) speechSynthesis.cancel();
    if (curAudio) { curAudio.pause(); }
    const a = new Audio('audio/' + k + '.m4a');
    const r = (P() && P().settings.rate) || 0.9;
    a.playbackRate = slow ? 0.7 : Math.min(1.2, Math.max(0.7, r / 0.9));
    a.preservesPitch = true; a.webkitPreservesPitch = true;
    curAudio = a;
    const pr = a.play(); if (pr && pr.catch) pr.catch(() => {});
    return true;
  } catch (e) { return false; }
}
function speak(text, slow) {
  if (!text) return;
  if (playRecorded(text, slow)) return;
  if (!hasTTS) return;
  try {
    if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[\s　]+/g, ''));
    u.lang = 'ja-JP';
    if (jaVoice) u.voice = jaVoice;
    u.rate = slow ? 0.55 : ((P() && P().settings.rate) || 0.9);
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ---------- Lernlogik ---------- */
const INTERVALS = [0, 1, 2, 4, 7, 14, 30];   // Tage je Box
const LEN = {
  kurz:   {n:12, neu:3,  label:'Kurz',   min:'ca. 5 Min'},
  normal: {n:28, neu:6,  label:'Normal', min:'ca. 15 Min'},
  sprint: {n:70, neu:14, label:'Sprint', min:'ca. 45 Min'}
};
const XP = {right:10, wrong:2, intro:5};

let cur = {screen: S.last && S.profiles[S.last] ? 'home' : 'pick', pid: S.last || null, sess:null, sheetFilter:'all', sheetQ:'', confirmReset:false};
const P = () => cur.pid ? S.profiles[cur.pid] : null;
const PROF = () => PROFILES.find(p => p.id === cur.pid);

function fill(item, prof) {
  if (!prof || item.type !== 'p') return item;
  const r = s => s ? s.replace(/\{name\}/g, prof.name).replace(/\{kana\}/g, prof.kana).replace(/\{ro\}/g, prof.ro) : s;
  return Object.assign({}, item, {jp:r(item.jp), ro:r(item.ro), de:r(item.de), note:r(item.note)});
}
function missionItems(mid) { return ITEMS.filter(i => i.m === mid); }
function missionStats(p, mid) {
  const its = missionItems(mid); let seen = 0, ok = 0, known = 0;
  its.forEach(i => { const c = p.cards[i.id]; if (c) { seen++; if (c.box >= 1) ok++; if (c.box >= 2) known++; } });
  return {n:its.length, seen, ok, known};
}
function isUnlocked(p, idx) {
  const m = MISSIONS[idx];
  if (!m.ready) return false;
  if (idx === 0) return true;
  const st = missionStats(p, MISSIONS[idx - 1].id);
  return st.n > 0 && st.ok / st.n >= 0.6;
}
function knownCount(p) { return ITEMS.filter(i => p.cards[i.id] && p.cards[i.id].box >= 2).length; }
const sumObj = o => Object.values(o || {}).reduce((a, b) => a + (+b || 0), 0);
function weekXP(p) { return sumObj(p.xp[weekKey()]); }
function totalXP(p) { return Object.values(p.xp).reduce((a, w) => a + sumObj(w), 0); }
function sessionCount(p) { return sumObj(p.sess); }
function addXP(p, n) { const k = weekKey(); const w = p.xp[k] || (p.xp[k] = {}); w[DEV] = (w[DEV] || 0) + n; }

function orderedFresh(p) {
  const out = [];
  MISSIONS.forEach((m, idx) => {
    if (!isUnlocked(p, idx)) return;
    const ph = ITEMS.filter(i => i.m === m.id && i.type === 'p' && !p.cards[i.id]);
    const ka = ITEMS.filter(i => i.m === m.id && i.type === 'k' && !p.cards[i.id]);
    while (ph.length || ka.length) {
      if (ph.length) out.push(ph.shift());
      if (ph.length) out.push(ph.shift());
      if (ka.length) out.push(ka.shift());
    }
  });
  return out;
}

function buildSession(p, len) {
  const cfg = LEN[len], t = today();
  const seenItems = ITEMS.filter(i => p.cards[i.id]);
  const due = seenItems.filter(i => p.cards[i.id].due <= t)
    .sort((a, b) => (p.cards[a.id].box - p.cards[b.id].box) || (p.cards[a.id].due < p.cards[b.id].due ? -1 : 1));
  const fresh = orderedFresh(p);
  const nq = fresh.slice(0, cfg.neu);
  const rq = due.slice(0, Math.max(cfg.n - nq.length * 2, 4));
  const seq = [], pend = [];
  while (nq.length || rq.length || pend.length) {
    const ready = pend.findIndex(x => x.wait <= 0);
    if (ready >= 0) { seq.push({kind:'quiz', id:pend.splice(ready, 1)[0].id, mode:'normal'}); }
    else if (nq.length && (!rq.length || seq.length % 3 !== 2)) {
      const i = nq.shift(); pend.forEach(x => x.wait--);
      seq.push({kind:'intro', id:i.id}); pend.push({id:i.id, wait:2}); continue;
    }
    else if (rq.length) { seq.push({kind:'quiz', id:rq.shift().id, mode:'normal'}); }
    else { seq.push({kind:'quiz', id:pend.shift().id, mode:'normal'}); continue; }
    pend.forEach(x => x.wait--);
  }
  // Auffüllen: erst weitere neue Inhalte (nicht bei "Kurz"), dann Übung mit bekannten Karten
  const used = new Set(seq.map(s => s.id));
  if (len !== 'kurz') {
    fresh.slice(cfg.neu, cfg.neu * 2).forEach(i => {
      if (seq.length >= cfg.n - 1) return;
      seq.push({kind:'intro', id:i.id}); seq.push({kind:'quiz', id:i.id, mode:'normal'}); used.add(i.id);
    });
  }
  const practice = shuffle(seenItems.filter(i => !used.has(i.id))).sort((a, b) => p.cards[a.id].box - p.cards[b.id].box);
  for (const i of practice) { if (seq.length >= cfg.n) break; seq.push({kind:'quiz', id:i.id, mode:'practice'}); }
  return seq.slice(0, cfg.n);
}

function quizType(item, card) {
  const b = card ? card.box : 0, r = Math.random();
  if (item.type === 'k') return r < 0.55 ? 'k2r' : 's2k';
  if (b <= 1) return r < 0.5 ? 'listen' : 'recall';
  if (b <= 3) return r < 0.34 ? 'listen' : r < 0.67 ? 'recall' : 'speak';
  return r < 0.65 ? 'speak' : 'recall';
}
function makeOptions(item, field) {
  const pool = shuffle(ITEMS.filter(i => i.type === item.type && i.id !== item.id && MIS[i.m].ready));
  const prof = PROF(), chosen = [fill(item, prof)], vals = new Set([fill(item, prof)[field]]);
  for (const i of pool) { const f = fill(i, prof); if (!vals.has(f[field])) { chosen.push(f); vals.add(f[field]); } if (chosen.length === 4) break; }
  return shuffle(chosen);
}
function grade(p, id, correct, mode) {
  const t = today();
  const c = p.cards[id] || (p.cards[id] = {box:0, due:t, right:0, wrong:0});
  if (correct) {
    c.t = Date.now();
    c.right++;
    if (mode === 'retry') { c.due = addDays(t, 1); }
    else { if (mode !== 'practice' || c.due <= t) c.box = Math.min(c.box + 1, INTERVALS.length - 1); c.due = addDays(t, INTERVALS[c.box]); }
  } else {
    c.t = Date.now(); c.wrong++; c.box = Math.max(0, c.box - 2); c.due = t;
  }
}
function checkStamps(p) {
  const won = [];
  MISSIONS.forEach((m, idx) => {
    if (!m.ready || p.stamps.includes(m.id) || !isUnlocked(p, idx)) return;
    const st = missionStats(p, m.id);
    if (st.n && st.known === st.n) { p.stamps.push(m.id); won.push(m); }
  });
  return won;
}

/* ----- Session ----- */
function startSession(len) {
  const p = P();
  const steps = buildSession(p, len);
  if (!steps.length) { cur.screen = 'home'; render(); return; }
  cur.sess = {len, steps, i:0, right:0, wrong:0, xp:0, newIds:[], answered:false, picked:null, revealed:false};
  p.sess[DEV] = (p.sess[DEV] || 0) + 1; save();
  cur.screen = 'session';
  prepStep();
  render();
  autoAudio();
}
function step() { return cur.sess.steps[cur.sess.i]; }
function prepStep() {
  const s = step(); if (!s) return;
  cur.sess.answered = false; cur.sess.picked = null; cur.sess.revealed = false;
  if (s.kind === 'quiz' && !s.type) {
    const item = ITEM[s.id];
    s.type = quizType(item, P().cards[s.id]);
    if (s.type === 'listen') s.opts = makeOptions(item, 'de');
    if (s.type === 'recall') s.opts = makeOptions(item, 'jp');
    if (s.type === 'k2r') s.opts = makeOptions(item, 'ro');
    if (s.type === 's2k') s.opts = makeOptions(item, 'jp');
  }
}
function autoAudio() {
  const s = step(); if (!s) return;
  const it = fill(ITEM[s.id], PROF());
  if (s.kind === 'intro' || s.type === 'listen' || s.type === 's2k') speak(it.jp);
}
function renderSession() {
  const se = cur.sess, s = step(), p = P();
  const pct = Math.round(se.i / se.steps.length * 100);
  const item = ITEM[s.id], it = fill(item, PROF());
  let body = '';
  if (s.kind === 'intro') {
    body = `<span class="chip" style="align-self:center">Neu</span>
      ${signHTML(item, {ro:true})}
      ${audioRow(it.jp)}
      ${item.type === 'k' ? `<p class="note">${esc(item.tip)}</p>` : `<p class="note">${esc(it.note)}</p>`}
      <button class="btn" data-act="next">Weiter</button>`;
  } else {
    const t = s.type, ans = se.answered;
    let prompt = '', optsHTML = '';
    if (t === 'listen') {
      prompt = `<p class="prompt">Was bedeutet das?</p><button class="play" data-act="say" data-t="${esc(it.jp)}" aria-label="Nochmal anhören">${IC.speaker}</button>`;
      optsHTML = optList(s, o => `<span class="em" aria-hidden="true">${o.em || ''}</span><span>${esc(o.de)}</span>`);
    } else if (t === 'recall') {
      prompt = `<div class="prompt-de"><span class="em" aria-hidden="true">${it.em || ''}</span><span class="de">${esc(it.de)}</span><span class="muted small">Wie sagt man das auf Japanisch?</span></div>`;
      optsHTML = optList(s, o => `<span class="ojp" lang="ja">${esc(o.jp)}</span>${p.settings.romaji || ans ? `<span class="oro">${esc(o.ro)}</span>` : ''}`);
    } else if (t === 'k2r') {
      prompt = `<p class="prompt">Wie liest man dieses Zeichen?</p><div class="sign"><div class="sign-top"><div class="sign-jp kana" lang="ja">${esc(it.jp)}</div></div></div>`;
      optsHTML = optList(s, o => `<span style="font-size:24px;font-weight:700">${esc(o.ro)}</span>`);
    } else if (t === 's2k') {
      prompt = `<p class="prompt">Welches Zeichen hörst du?</p><button class="play" data-act="say" data-t="${esc(it.jp)}" aria-label="Nochmal anhören">${IC.speaker}</button>`;
      optsHTML = optList(s, o => `<span class="ojp kana" lang="ja">${esc(o.jp)}</span>${ans ? `<span class="oro">${esc(o.ro)}</span>` : ''}`);
    } else if (t === 'speak') {
      prompt = `<div class="prompt-de"><span class="em" aria-hidden="true">${it.em || ''}</span><span class="de">${esc(it.de)}</span><span class="muted small">Sag es laut auf Japanisch. Dann aufdecken.</span></div>`;
    }
    let after = '';
    if (t === 'speak') {
      if (!se.revealed) after = `<button class="btn" data-act="reveal">Aufdecken</button>`;
      else after = `${signHTML(item, {ro:true})}${audioRow(it.jp)}
        <p class="prompt" style="font-size:17px">Hast du es gewusst?</p>
        <div class="row"><button class="btn ghost" data-act="self" data-v="0">Noch nicht</button><button class="btn" data-act="self" data-v="1">Gewusst</button></div>`;
    } else if (ans) {
      const ok = fill(ITEM[s.id], PROF())[fieldOf(t)] === se.pickedVal;
      after = `<p class="feedback ${ok ? 'ok' : 'no'}">${ok ? 'Richtig!' : 'Fast. So heißt es:'}</p>
        ${t === 'k2r' || t === 's2k' ? `<p class="note" style="text-align:center">${esc(item.tip)}</p>` : `${signHTML(item, {ro:true})}<p class="note">${esc(it.note)}</p>`}
        <button class="btn" data-act="next">Weiter</button>`;
    }
    body = `${prompt}${optsHTML ? `<div class="opts">${optsHTML}</div>` : ''}${after}`;
  }
  return `
  <div class="sess-top">
    <button class="iconbtn" data-act="quit" aria-label="Session beenden">${IC.close}</button>
    <div class="bar"><span style="width:${pct}%"></span></div>
    <span class="small muted" style="font-variant-numeric:tabular-nums">${se.i + 1}/${se.steps.length}</span>
  </div>
  ${body}`;
}
function fieldOf(t) { return t === 'listen' ? 'de' : t === 'k2r' ? 'ro' : 'jp'; }
function optList(s, inner) {
  const se = cur.sess, f = fieldOf(s.type), right = fill(ITEM[s.id], PROF())[f];
  return s.opts.map((o, idx) => {
    let cls = 'opt';
    if (se.answered) { if (o[f] === right) cls += ' right'; else if (idx === se.pickedIdx) cls += ' wrong'; }
    return `<button class="${cls}" data-act="pick" data-v="${idx}" ${se.answered ? 'disabled' : ''}>${inner(o)}</button>`;
  }).join('');
}
function answer(correct) {
  const se = cur.sess, s = step(), p = P();
  grade(p, s.id, correct, s.mode);
  const gain = correct ? XP.right : XP.wrong;
  se.xp += gain; addXP(p, gain);
  if (correct) se.right++; else {
    se.wrong++;
    if (s.mode !== 'retry') { const at = Math.min(se.i + 3, se.steps.length); se.steps.splice(at, 0, {kind:'quiz', id:s.id, mode:'retry'}); }
  }
  save();
}
function next() {
  const se = cur.sess;
  if (step() && step().kind === 'intro') { se.xp += XP.intro; addXP(P(), XP.intro); save(); }
  se.i++;
  if (se.i >= se.steps.length) return finish();
  prepStep(); render(); window.scrollTo(0, 0); autoAudio();
}
function finish() {
  const p = P();
  cur.sess.won = checkStamps(p);
  save();
  cur.screen = 'done'; render(); window.scrollTo(0, 0);
}
function renderDone() {
  const se = cur.sess, p = P();
  const total = se.right + se.wrong;
  return `
  <div style="text-align:center;display:flex;flex-direction:column;gap:8px;padding-top:12px">
    <h1 lang="ja" style="font-size:34px">おつかれさま！</h1>
    <p class="muted">„Gute Arbeit!“ So bedankt man sich in Japan nach getaner Arbeit.</p>
  </div>
  ${se.won && se.won.length ? `<section class="panel" style="align-items:center;text-align:center">
     ${se.won.map(m => stampHTML(m, 'big pop')).join('')}
     <b>Neuer Stempel: Mission ${se.won.map(m => m.no + ' ' + esc(m.title)).join(', ')}</b>
     <p class="small muted">Alles aus dieser Mission sitzt jetzt sicher.</p></section>` : ''}
  <section class="panel">
    <div class="bar-label"><b style="color:var(--ink)">+${se.xp} XP</b><span>${total ? `${se.right} von ${total} richtig` : 'Neue Inhalte angesehen'}</span></div>
    <div class="bar-label"><span>Wochenziel</span><span>${weekXP(p)} / ${p.settings.goal} XP</span></div>
    ${weekBar(p)}
  </section>
  <div class="row">
    <button class="btn ghost" data-act="go" data-v="home">Fertig</button>
    <button class="btn" data-act="start" data-v="${se.len}">Noch eine Runde</button>
  </div>`;
}

    <div class="set"><div><b>Profil wechseln</b></div><button class="btn ghost small" data-act="switch">Wer lernt?</button></div>
    <div class="set"><div><b>Fortschritt von ${esc(pr.name)} zurücksetzen</b><p class="small muted">Löscht den Lernstand dieses Profils, auch auf den anderen Geräten.</p></div>
      ${cur.confirmReset ? `<div class="row" style="flex:none"><button class="btn ghost small" data-act="reset-no">Abbrechen</button><button class="btn small" style="background:var(--bad)" data-act="reset-yes">Löschen</button></div>`
        : `<button class="btn ghost small" data-act="reset">Zurücksetzen</button>`}</div>
  </div>
  ${storageNote()}`;
}

/* ---------- Render & Events ---------- */
function render() {
  const sc = cur.screen;
  let html = '';
  const needLogin = Sync.state === 'login' && !S.localOnly && sc !== 'session' && sc !== 'done';
  if (needLogin) { html = renderLogin(); }
  else if (sc === 'pick' || !P()) { cur.screen = 'pick'; html = renderPick(); }
  else if (sc === 'home') html = renderHome();
  else if (sc === 'session') html = renderSession();
  else if (sc === 'done') html = renderDone();
  else if (sc === 'sheet') html = renderSheet();
  else if (sc === 'family') html = renderFamily();
  else if (sc === 'settings') html = renderSettings();
  app.innerHTML = html;
  const showTabs = !needLogin && ['home', 'sheet', 'family'].includes(cur.screen);
  tabs.hidden = !showTabs;
  document.body.classList.toggle('in-session', !showTabs);
  tabs.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.v === cur.screen));
  if (cur.screen === 'sheet') {
    const q = document.getElementById('sheet-q');
    q.addEventListener('input', () => { cur.sheetQ = q.value; document.getElementById('sheet-list').innerHTML = sheetList(); });
  }
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, v = b.dataset.v, p = P();
  switch (act) {
    case 'choose': cur.pid = v; S.last = v; saveLocal(); cur.screen = 'home'; render(); break;
    case 'switch': cur.screen = 'pick'; render(); break;
    case 'tab': case 'go': cur.screen = v; cur.confirmReset = false; render(); window.scrollTo(0, 0); break;
    case 'start': startSession(v); window.scrollTo(0, 0); break;
    case 'say': speak(b.dataset.t, b.dataset.slow === '1'); break;
    case 'next': next(); break;
    case 'quit': finish(); break;
    case 'pick': {
      const se = cur.sess, s = step(); if (se.answered) break;
      const idx = +v, f = fieldOf(s.type), o = s.opts[idx];
      const ok = o[f] === fill(ITEM[s.id], PROF())[f];
      se.answered = true; se.pickedIdx = idx; se.pickedVal = o[f];
      answer(ok);
      render();
      speak(fill(ITEM[s.id], PROF()).jp);
      break;
    }
    case 'reveal': cur.sess.revealed = true; render(); speak(fill(ITEM[step().id], PROF()).jp); break;
    case 'self': answer(v === '1'); next(); break;
    case 'mission': cur.sheetFilter = v; cur.sheetQ = ''; cur.screen = 'sheet'; render(); window.scrollTo(0, 0); break;
    case 'sf': cur.sheetFilter = v; render(); break;
    case 'romaji': p.settings.romaji = !p.settings.romaji; p.settings.t = Date.now(); save(); render(); break;
    case 'goal': p.settings.goal = +v; p.settings.t = Date.now(); save(); render(); break;
    case 'rate': p.settings.rate = +v; p.settings.t = Date.now(); save(); render(); speak('こんにちは'); break;
    case 'voice': { const list = jaVoices(), vo = list[+v]; if (vo) { S.voiceKey = voiceKey(vo, list); saveLocal(); jaVoice = vo; } render(); } speak('すみません、ラーメンを ひとつ おねがいします。'); break;
    case 'local-only': S.localOnly = true; saveLocal(); render(); break;
    case 'login': S.localOnly = false; saveLocal(); render(); break;
    case 'logout': Sync.logout().then(() => { S.localOnly = false; saveLocal(); render(); }); break;
    case 'sync-now': Sync.pullAll(); break;
    case 'reset': cur.confirmReset = true; render(); break;
    case 'reset-no': cur.confirmReset = false; render(); break;
    case 'reset-yes': S.profiles[cur.pid] = Object.assign(blankProfile(), {epoch: Date.now()}); cur.confirmReset = false; save(); cur.screen = 'home'; render(); break;
  }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'login-form') return;
  e.preventDefault();
  const email = document.getElementById('login-email').value.trim(), pw = document.getElementById('login-pw').value;
  cur.loggingIn = true; cur.loginErr = ''; render();
  Sync.login(email, pw).then(() => { cur.loggingIn = false; render(); })
    .catch(err => {
      cur.loggingIn = false;
      cur.loginErr = /invalid/i.test(err && err.message || '') ? 'E-Mail oder Passwort stimmt nicht.' : 'Anmelden gerade nicht möglich. Besteht eine Internetverbindung?';
      render();
      const em = document.getElementById('login-email'); if (em) em.value = email;
    });
});
document.addEventListener('keydown', e => {
  if (cur.screen !== 'session') return;
  if (e.key === 'Enter') { const b = app.querySelector('[data-act="next"],[data-act="reveal"]'); if (b) { e.preventDefault(); b.click(); } }
  if (/^[1-4]$/.test(e.key)) { const b = app.querySelectorAll('[data-act="pick"]')[+e.key - 1]; if (b && !b.disabled) b.click(); }
});

render();
Sync.init();
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
})();
</script>
</body>
</html>
